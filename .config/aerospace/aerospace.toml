# version update
config-version = 2

# Enable normalization (auto-balance window sizes)
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# # ×××××× [ theme ] ×××××××

exec-on-workspace-change = ['/bin/bash', '-c', 'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE']
on-focus-changed = ['exec-and-forget sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE']
persistent-workspaces = []

[workspace-to-monitor-force-assignment]
# main
1 = 'main'
4 = 'main'
7 = 'main'

# 2
2 = 1
5 = 1
8 = 1

# 3
3 = 3
6 = 3
9 = 3
    

# ×××××× [ gaps ] ×××××××

[gaps]
inner.horizontal = 16
inner.vertical = 16
outer.left = 16
outer.bottom = 16
outer.right = 16
outer.top = [
  { monitor.1 = 46 }, # Small/zero gap for MacBook internal display
  { monitor.2 = 16 },
  { monitor.3 = 46 },
  16
  ]

# ×××××× [ float-rules ] ×××××××

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences' # System Settings
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.SystemProfiler' # System Information
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator' # Calculator
run = 'layout floating'


# ×××××× [ main ] ×××××××

[mode.main.binding]

# ×××××× [ apps ] ×××××××
alt-enter = 'exec-and-forget open -n -a kitty'

# ×××××× [ nav ] ×××××××
alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'

# ×××××× [ mv ] ×××××××
alt-shift-left = 'move left'
alt-shift-down = 'move down'
alt-shift-up = 'move up'
alt-shift-right = 'move right'

# ×××××× [ float] ×××××××
alt-shift-space = 'layout floating tiling'

# ×××××× [ split ] ×××××××
alt-e = 'layout tiles horizontal vertical'

# ×××××× [ balance ] ×××××××
alt-shift-e = 'balance-sizes'

# ×××××× [ close ] ×××××××
alt-shift-q = 'close'

# ×××××× [ workspace-move ] ×××××××
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# ×××××× [ switch] ×××××××
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# ×××××× [ reload ] ×××××××

alt-shift-c = 'exec-and-forget reload-config'
alt-shift-s = 'exec-and-forget screencapture -i -c'

# ×××××× [ next ] ×××××××
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

